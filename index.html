<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0f2419">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brendan – start</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<style>
:root{color-scheme:dark;--bg:#0f2419;--bg2:#0a1a11;--kaart:#17332a;--tekst:#efe6cf;--meta:#a9b79f;--rand:#2f4e40;--accent:#d8c48e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,#1c4030 0%,var(--bg) 55%,var(--bg2) 100%) fixed;color:var(--tekst);font:16px/1.4 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:40px 16px 48px}
.kop{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:30px}
#logo{width:270px;height:90px;margin-bottom:12px;background:var(--accent);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;display:none}
#mono{width:84px;height:84px;border:2px solid var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);font:700 30px/1 Georgia,serif;margin-bottom:12px}
h1{margin:0 0 4px;font:600 28px Georgia,serif;color:var(--accent);letter-spacing:.04em}
.sub{color:var(--meta)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--meta);margin:28px 0 10px;border-bottom:1px solid var(--rand);padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
a.k{display:flex;gap:12px;align-items:center;background:var(--kaart);border:1px solid var(--rand);border-radius:14px;padding:14px;text-decoration:none;color:inherit;transition:transform .12s,border-color .12s}
a.k:hover{border-color:var(--accent);transform:translateY(-2px)}
.i{font-size:30px;line-height:1}
.n{font-weight:700;color:var(--accent)}
.o{font-size:13px;color:var(--meta)}
.nieuw{border-style:dashed}
.tag{font-size:11px;background:var(--accent);color:var(--bg);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
footer{margin-top:34px;font-size:12px;color:var(--meta);text-align:center}
</style>
</head>
<body>
<main>
  <div class="kop"><div id="logo"></div><div id="mono">BK</div><h1>Brendan</h1><div class="sub">Mijn kleine sites en webapps</div></div>
  <div id="inh"></div>
  <footer id="vt"></footer>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kaart=(s,nieuw)=>`<a class="k ${nieuw?"nieuw":""}" href="${esc(s.url)}"><span class="i">${esc(s.icoon||"🔗")}</span><span><span class="n">${esc(s.naam)}</span>${nieuw?'<span class="tag">nieuw gevonden</span>':""}<br><span class="o">${esc(s.omschrijving||"")}</span></span></a>`;
// logo: zet logo.svg (of logo.png) in de repo; het wordt automatisch beige gekleurd
(function(){const kies=["logo.svg","logo.png"];let i=0;const t=()=>{if(i>=kies.length)return;const im=new Image(),f=kies[i++];im.onload=()=>{$("logo").style.setProperty("--logo",`url(${f})`);$("logo").style.display="block";$("mono").style.display="none"};im.onerror=t;im.src=f};t()})();
async function start(){
  const cfg=await (await fetch("sites.json?"+Date.now())).json();
  const groepen={};
  cfg.sites.forEach(s=>(groepen[s.groep||"Overig"]=groepen[s.groep||"Overig"]||[]).push(s));
  let h=Object.entries(groepen).map(([g,l])=>`<h2>${esc(g)}</h2><div class="grid">${l.map(s=>kaart(s)).join("")}</div>`).join("");
  $("inh").innerHTML=h;
  // automatisch zoeken naar GitHub Pages-sites die nog niet in de lijst staan
  try{
    const bekend=new Set([...cfg.sites.map(s=>s.repo),...(cfg.verborgen||[])].map(x=>x.toLowerCase()));
    const repos=await (await fetch("https://api.github.com/users/brennyc86/repos?per_page=100&type=owner")).json();
    const nieuw=repos.filter(r=>r.has_pages&&!r.private&&!bekend.has(r.name.toLowerCase())).map(r=>({naam:r.name,icoon:"🆕",url:`https://brennyc86.github.io/${r.name}/`,omschrijving:r.description||"Nog niet in sites.json"}));
    if(nieuw.length)$("inh").insertAdjacentHTML("beforeend",`<h2>Automatisch gevonden</h2><div class="grid">${nieuw.map(s=>kaart(s,true)).join("")}</div>`);
  }catch(e){}
  $("vt").textContent="Lijst staat in sites.json in de repo brennyc86.github.io";
}
start().catch(e=>{$("inh").textContent="Kon de lijst niet laden: "+e});
</script>
</body>
</html>
